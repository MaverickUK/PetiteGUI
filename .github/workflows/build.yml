name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  OPEN_WATCOM_BUILD: 2026-11-01-Build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        # SemVer in src/version.h, with a CHANGELOG.md entry
        run: |
          version=$(sed -n 's/.*PETITE_VERSION "\(.*\)".*/\1/p' src/version.h)
          echo "Version $version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::not SemVer: $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $version"; exit 1; }

      - name: Cache Open Watcom
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/opt/openwatcom
          key: openwatcom-${{ env.OPEN_WATCOM_BUILD }}

      - name: Install Open Watcom
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/opt/openwatcom
          curl -fsSL "https://github.com/open-watcom/open-watcom-v2/releases/download/$OPEN_WATCOM_BUILD/ow-snapshot.tar.xz" \
            | tar -xJ -C ~/opt/openwatcom

      - name: Host tests
        run: make test

      - name: Build
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: petite-exe
          path: build/PETITE.EXE
