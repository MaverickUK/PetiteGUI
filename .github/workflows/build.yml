name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  OPEN_WATCOM_BUILD: 2026-11-01-Build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version and changelog
        # SemVer in src/version.h, a CHANGELOG.md section for it, and a bump with every change
        # to what's built (compared with the commit before this push, or the PR's base)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before || '') }}
        run: tools/check-changelog.sh $BASE

      - name: Cache Open Watcom
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/opt/openwatcom
          key: openwatcom-${{ env.OPEN_WATCOM_BUILD }}

      - name: Install Open Watcom
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/opt/openwatcom
          curl -fsSL "https://github.com/open-watcom/open-watcom-v2/releases/download/$OPEN_WATCOM_BUILD/ow-snapshot.tar.xz" \
            | tar -xJ -C ~/opt/openwatcom

      - name: Install NASM
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm

      - name: Host tests
        run: make test

      - name: Build
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: petite-exe
          path: build/PETITE.EXE

  dos:
    name: DOS tests (DOSBox-X)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Open Watcom
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/opt/openwatcom
          key: openwatcom-${{ env.OPEN_WATCOM_BUILD }}

      - name: Install Open Watcom
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/opt/openwatcom
          curl -fsSL "https://github.com/open-watcom/open-watcom-v2/releases/download/$OPEN_WATCOM_BUILD/ow-snapshot.tar.xz" \
            | tar -xJ -C ~/opt/openwatcom

      - name: Install NASM and DOSBox-X
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm dosbox-x

      - name: End-to-end tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: make dostest
